name: Free Fire Pro Coach APK Builder

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate Android SDK
    shell: bash
    run: |
      echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

  - name: Accept Android SDK licences
    shell: bash
    run: |
      SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

      if [ -z "$SDKMANAGER" ]; then
        echo "ERROR: Android SDK manager was not found."
        exit 1
      fi

      yes | "$SDKMANAGER" --licenses

  - name: Install Android SDK packages
    shell: bash
    run: |
      SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

      "$SDKMANAGER" --install \
        "platform-tools" \
        "platforms;android-36" \
        "build-tools;36.0.0"

  - name: Extract project ZIP
    shell: bash
    run: |
      mkdir -p extracted

      ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No project ZIP found in the repository root."
        exit 1
      fi

      unzip -q "$ZIP_FILE" -d extracted

      SETTINGS_FILE=$(find extracted -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERROR: No Android Gradle project settings file found."
        exit 1
      fi

      PROJECT_DIR=$(dirname "$SETTINGS_FILE")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      echo "Android project found at: $PROJECT_DIR"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.3.1'

  - name: Build APK
    shell: bash
    run: |
      cd "$PROJECT_DIR"

      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace
      else
        gradle assembleDebug --no-daemon --stacktrace
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Free-Fire-Pro-Coach-APK
      path: |
        extracted/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
